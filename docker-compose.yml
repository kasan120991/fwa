name: fwa-ops

# Production stack for the FWA ops app, deployed alongside the marketing site on
# the same box. The marketing site's Caddy (network website_default) reverse-
# proxies OPS_DOMAIN: /api,/socket.io,/uploads -> api:4000, everything else ->
# app:3000 (see deploy/ops.Caddyfile). Values come from .env.production.
#   docker compose --env-file .env.production up -d --build

services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    command: ["--innodb-buffer-pool-size=128M", "--performance-schema=OFF"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: fwa_ops
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [internal]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      # Both front-ends share this API; same-origin proxying makes CORS mostly moot,
      # but allow both origins as a safety net.
      CORS_ORIGIN: https://${OPS_DOMAIN},https://${PORTAL_DOMAIN}
      # Base URL used to build portal set-password links in invite emails.
      PORTAL_BASE_URL: https://${PORTAL_DOMAIN}
      # Base URL used to deep-link alert emails at the admin record they're about.
      APP_BASE_URL: https://${OPS_DOMAIN}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_NAME: fwa_ops
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      PANDADOC_API_KEY: ${PANDADOC_API_KEY}
      PANDADOC_WEBHOOK_KEY: ${PANDADOC_WEBHOOK_KEY}
      PANDADOC_OWNER_ROLE: ${PANDADOC_OWNER_ROLE:-}
      PANDADOC_CLIENT_ROLE: ${PANDADOC_CLIENT_ROLE:-Client}
      CONTACT_FORM_WEBHOOK_SECRET: ${CONTACT_FORM_WEBHOOK_SECRET}
      VAPI_WEBHOOK_SECRET: ${VAPI_WEBHOOK_SECRET:-}
      VAPI_ASSISTANT_ID: ${VAPI_ASSISTANT_ID:-}
      VAPI_PHONE_NUMBER: ${VAPI_PHONE_NUMBER:-}
      VAPI_DEMO_ASSISTANT_ID: ${VAPI_DEMO_ASSISTANT_ID:-}
      VAPI_API_KEY: ${VAPI_API_KEY:-}
      PLAUSIBLE_API_KEY: ${PLAUSIBLE_API_KEY:-}
      PLAUSIBLE_BASE_URL: ${PLAUSIBLE_BASE_URL:-https://plausible.io}
      GA4_CLIENT_EMAIL: ${GA4_CLIENT_EMAIL:-}
      GA4_PRIVATE_KEY_BASE64: ${GA4_PRIVATE_KEY_BASE64:-}
      DIGITALOCEAN_API_TOKEN: ${DIGITALOCEAN_API_TOKEN:-}
      DIGITALOCEAN_BASE_URL: ${DIGITALOCEAN_BASE_URL:-https://api.digitalocean.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: "${RESEND_FROM:-Francis Web Agency <info@franciswebagency.com>}"
      ALERTS_EMAIL: ${ALERTS_EMAIL:-info@franciswebagency.com}
    volumes:
      - api_uploads:/app/uploads
    networks: [internal, proxy]
    depends_on:
      mysql:
        condition: service_healthy

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # ssr:false SPA served by Nitro — public runtimeConfig is injected at runtime.
      NUXT_PUBLIC_API_BASE: https://${OPS_DOMAIN}/api
    networks: [internal, proxy]
    depends_on:
      - api

  # Client portal — its own Nuxt SPA on PORTAL_DOMAIN, talking to the shared API
  # same-origin (Caddy proxies /api,/socket.io,/uploads -> api:4000).
  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: https://${PORTAL_DOMAIN}/api
    networks: [internal, proxy]
    depends_on:
      - api

  # ---------------------------------------------------------------------------
  # Public demo (DEMO_DOMAIN) — the same two images as the real app, pointed at a
  # separate `fwa_ops_demo` database inside the SAME mysql container. The box is
  # a 2 GB droplet, so a second mysqld is the one thing we don't duplicate; the
  # demo still gets full data isolation (own schema, own uploads volume).
  #
  # Behind the `demo` profile, so the normal deploy command never starts, stops,
  # or rebuilds it. Bring it up by NAMING the two services — enabling the profile
  # without them would sweep the real api/app into the same rebuild+recreate:
  #   docker compose --env-file .env.production --profile demo up -d --build api-demo app-demo
  #
  # Every integration key is deliberately LEFT UNSET here (they default to '' in
  # server/src/config/env.js, which disables each one). That's what makes the
  # demo safe to hand to a stranger: no Stripe customer, no PandaDoc document,
  # no Resend email, and no Vapi call can leave this instance.
  # ---------------------------------------------------------------------------
  api-demo:
    profiles: [demo]
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      # Passwordless demo sign-in — the ONLY container where this is on.
      DEMO_MODE: "true"
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@franciswebagency.com}
      CORS_ORIGIN: https://${DEMO_DOMAIN}
      APP_BASE_URL: https://${DEMO_DOMAIN}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_NAME: fwa_ops_demo
      # Background jobs off: uptime checks would hit the seeded placeholder
      # domains, and reminders/alerts would drift the data away from the seed
      # between nightly resets.
      WEBSITE_CHECKS_ENABLED: "false"
      EXPENSE_REMINDERS_ENABLED: "false"
      DIGITALOCEAN_ALERTS_ENABLED: "false"
    volumes:
      - demo_uploads:/app/uploads
    networks: [internal, proxy]
    depends_on:
      mysql:
        condition: service_healthy

  app-demo:
    profiles: [demo]
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: https://${DEMO_DOMAIN}/api
      # Auto-sign-in as the demo account + the "resets nightly" strip.
      NUXT_PUBLIC_DEMO_MODE: "true"
    networks: [internal, proxy]
    depends_on:
      - api-demo

networks:
  internal:
  proxy:
    external: true
    # The marketing site's shared network. It's created by the website compose's
    # project name — currently `fwa-site` (network `fwa-site_default`). Override
    # via PROXY_NETWORK if/when the site is redeployed as `website`.
    name: ${PROXY_NETWORK:-fwa-site_default}

volumes:
  mysql_data:
  api_uploads:
  demo_uploads:
